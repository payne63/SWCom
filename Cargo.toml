[package]
name = "solidworks_connector"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
egui_extras = { version = "0.31.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15.3"
rust_xlsxwriter = "0.79"
windows = { version = "0.52.0", features = [
    # Initial Features needed for basic COM and Windows types
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

# Autres crates utilitaires si nécessaire (ex: pour la gestion des erreurs)
# log = "0.4"
# env_logger = "0.10"
